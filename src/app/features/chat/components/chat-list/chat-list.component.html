<div class="chat-list">
    @if (showToggleButton) {
        <button
                mat-icon-button
                type="button"
                class="chat-list__toggle"
                [attr.aria-label]="isOpen ? 'Скрыть список чатов' : 'Показать список чатов'"
                (click)="toggleMenu()"
        >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                @if (isOpen) {
                    <path d="m14 6-6 6 6 6" stroke="currentColor" stroke-width="2"/>
                } @else {
                    <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2"/>
                }
            </svg>
        </button>
    }

    @if (isOpen) {
        <div class="chat-list__backdrop" (click)="toggleMenu()"></div>
    }

    <aside class="chat-list__menu" [class.is-open]="isOpen">
        <div class="chat-list__header">Чаты</div>
        @if (canCreateChat) {
            <button
                    type="button"
                    class="chat-list__new"
                    (click)="createChat()"
            >+ Новый чат
            </button>
        }
        <nav class="chat-list__nav">
            @for (chat of chats; track chat.id) {
                <a
                        class="chat-list__item"
                        [class.is-active]="chat.id === selectedChatId"
                        (click)="selectChat(chat)"
                >{{ chat.name }}</a>
            }
        </nav>
    </aside>
</div>
