<div class="chat-container">
    <div class="chat-messages" #messagesContainer>
        <ng-container>
            @for (message of messages; track message.id) {
                <div
                        class="chat-message-group"
                        [class.chat-message-group--user]="message.sender === 'user'"
                        [class.chat-message-group--ai]="message.sender === 'ai'"
                >
                    @if (message.displayContent != '') {
                        <app-message-bubble
                                [message]="message"
                                [isTyping]="message.isTyping"
                                [displayContent]="message.displayContent"
                        ></app-message-bubble>
                    }

                    @if (message.sender === 'ai' && message.areViewsVisible && message.views?.length) {
                        <app-message-badges
                                [views]="message.views ?? []"
                                [disabled]="isLoading"
                                (badgeClick)="onViewClick($event)"
                        ></app-message-badges>
                    }
                </div>
            }
        </ng-container>

        @if (isLoading) {
            <app-loading-spinner></app-loading-spinner>
        }
    </div>

    <div class="chat-input-container">
        <app-chat-input
                (sendMessage)="onSendMessage($event)"
                [disabled]="isLoading"
        ></app-chat-input>
    </div>
</div>
